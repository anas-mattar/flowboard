<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowBoard — Kanban Prototype</title>
<style>
:root{
  --bg:#f1f2f6; --panel:#ffffff; --panel-2:#f7f8fa; --sidebar:#1f2b45; --sidebar-2:#28365a;
  --text:#172b4d; --text-dim:#6b778c; --line:#e2e5ea; --accent:#3d6df0; --accent-2:#2f57c4;
  --shadow:0 1px 2px rgba(9,30,66,.16), 0 0 1px rgba(9,30,66,.12);
  --shadow-lg:0 8px 24px rgba(9,30,66,.22);
  --radius:10px;
}
[data-theme="dark"]{
  --bg:#0f1420; --panel:#182031; --panel-2:#1e2739; --sidebar:#0b101b; --sidebar-2:#161e2e;
  --text:#e6ebf5; --text-dim:#93a0b8; --line:#2a3448; --accent:#5b86ff; --accent-2:#3d6df0;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;height:100vh;width:100%}

/* ---------- Sidebar ---------- */
.sidebar{width:250px;flex:0 0 250px;background:var(--sidebar);color:#dfe6f5;display:flex;flex-direction:column;transition:margin-left .2s}
.sidebar.collapsed{margin-left:-250px}
.brand{display:flex;align-items:center;gap:9px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#5b86ff,#8f5bff);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.brand b{font-size:16px;letter-spacing:.2px}
.brand small{display:block;font-size:10.5px;color:#8fa0c4;font-weight:400;letter-spacing:.4px;text-transform:uppercase}
.side-sec{padding:14px 12px 6px;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:#8393b8}
.side-list{overflow-y:auto;flex:1;padding:0 8px 12px}
.side-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:7px;color:#cdd8ee;text-align:left;font-size:13.5px}
.side-item:hover{background:var(--sidebar-2)}
.side-item.active{background:#2f57c4;color:#fff;font-weight:600}
.side-swatch{width:18px;height:18px;border-radius:4px;flex:0 0 18px}
.side-item .count{margin-left:auto;font-size:11px;color:#8393b8}
.side-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:8px}
.side-foot .avatar{width:28px;height:28px}
.side-foot .who{font-size:12.5px;line-height:1.2}
.side-foot .who small{color:#8393b8;font-size:11px}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.icon-btn{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--text-dim)}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.board-title{font-size:17px;font-weight:700;padding:4px 6px;border-radius:6px;border:1px solid transparent;background:transparent;min-width:120px}
.board-title:hover{border-color:var(--line)}
.board-title:focus{outline:none;border-color:var(--accent);background:var(--panel-2)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:196px}
.search input{border:0;background:none;outline:none;width:100%;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:500}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:#c9372c}
.btn.sm{padding:5px 9px;font-size:12.5px}
.avatars{display:flex}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:700;border:2px solid var(--panel);letter-spacing:.3px}
.avatars .avatar+.avatar{margin-left:-8px}
.chip-bar{display:flex;align-items:center;gap:7px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip-bar.hidden{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:12px}
.chip .x{color:var(--text-dim);font-weight:700}

/* ---------- Board ---------- */
.board{flex:1;display:flex;align-items:flex-start;gap:12px;padding:14px;overflow-x:auto;overflow-y:hidden}
.list{flex:0 0 286px;width:286px;max-height:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.list.drag-over{outline:2px dashed var(--accent);outline-offset:2px}
.list.dragging{opacity:.45}
.list-head{display:flex;align-items:center;gap:6px;padding:10px 10px 8px}
.list-head input{flex:1;border:1px solid transparent;background:none;font-weight:700;font-size:14px;border-radius:6px;padding:3px 5px;min-width:0}
.list-head input:hover{border-color:var(--line)}
.list-head input:focus{outline:none;border-color:var(--accent);background:var(--panel-2)}
.pill{font-size:11px;color:var(--text-dim);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.wip-over{color:#c9372c;border-color:#f3b4ae;background:#fff2f0;font-weight:700}
.cards{flex:1;overflow-y:auto;padding:2px 8px 4px;min-height:12px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow);cursor:pointer}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.4}
.card.drop-target{box-shadow:0 -3px 0 var(--accent)}
.card-labels{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.lab{height:8px;min-width:34px;border-radius:4px}
.lab.text{height:auto;font-size:10.5px;color:#fff;padding:1px 7px;font-weight:600;letter-spacing:.2px}
.card-title{font-size:13.5px;line-height:1.35}
.card-meta{display:flex;align-items:center;gap:9px;margin-top:8px;color:var(--text-dim);font-size:11.5px;flex-wrap:wrap}
.card-meta .m{display:inline-flex;align-items:center;gap:3px}
.due{padding:2px 6px;border-radius:5px;background:var(--line)}
.due.soon{background:#fff5d6;color:#7a5b00}
.due.over{background:#ffe3e0;color:#a8291e}
.due.done{background:#dcfbe6;color:#1a6b38}
.card-meta .avatar{width:22px;height:22px;font-size:9.5px;border-width:1px}
.list-foot{padding:6px 8px 9px}
.add-card{width:100%;text-align:left;padding:7px 9px;border-radius:7px;color:var(--text-dim);font-size:13px}
.add-card:hover{background:var(--panel-2);color:var(--text)}
.composer textarea{width:100%;resize:vertical;min-height:56px;border:1px solid var(--accent);border-radius:7px;padding:7px 9px;font-size:13.5px;background:var(--panel);outline:none}
.composer .row{display:flex;gap:6px;margin-top:6px;align-items:center}
.add-list{flex:0 0 286px;width:286px;padding:11px;border-radius:var(--radius);background:var(--panel);border:1px dashed var(--line);color:var(--text-dim);text-align:left;font-size:13.5px}
.add-list:hover{border-color:var(--accent);color:var(--text)}
.empty{padding:26px 14px;color:var(--text-dim);font-size:12.5px;text-align:center}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,30,66,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.scrim.open{display:flex}
.modal{width:100%;max-width:760px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden}
.modal-head{display:flex;gap:12px;padding:18px 18px 6px}
.modal-head textarea{flex:1;border:1px solid transparent;background:none;font-size:18px;font-weight:700;resize:none;border-radius:7px;padding:5px 7px;min-height:34px}
.modal-head textarea:focus{outline:none;border-color:var(--accent);background:var(--panel-2)}
.modal-sub{padding:0 18px 14px 18px;color:var(--text-dim);font-size:12.5px}
.modal-body{display:grid;grid-template-columns:1fr 190px;gap:18px;padding:0 18px 20px}
@media(max-width:700px){.modal-body{grid-template-columns:1fr}}
.sect{margin-bottom:18px}
.sect h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim)}
.desc{width:100%;min-height:86px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--panel-2);resize:vertical;font-size:13.5px;outline:none}
.desc:focus{border-color:var(--accent)}
.checkbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.checkbar i{display:block;height:100%;background:#22a06b;transition:width .2s}
.check-item{display:flex;align-items:center;gap:9px;padding:5px 4px;border-radius:6px}
.check-item:hover{background:var(--panel-2)}
.check-item span{flex:1;font-size:13.5px}
.check-item.done span{text-decoration:line-through;color:var(--text-dim)}
.side-actions{display:flex;flex-direction:column;gap:6px}
.side-actions .btn{justify-content:flex-start;width:100%}
.pop{position:absolute;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:11px;width:250px;display:none}
.pop.open{display:block}
.pop h5{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);text-align:center}
.pop-row{display:flex;align-items:center;gap:8px;width:100%;padding:6px 7px;border-radius:7px;text-align:left;font-size:13px}
.pop-row:hover{background:var(--panel-2)}
.pop-row .tick{margin-left:auto;color:#22a06b;font-weight:700}
.comment-box{display:flex;gap:9px;margin-bottom:12px}
.comment-box textarea{flex:1;min-height:56px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel-2);resize:vertical;font-size:13.5px;outline:none}
.act{display:flex;gap:9px;margin-bottom:11px}
.act .bubble{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13.5px;flex:1}
.act .when{color:var(--text-dim);font-size:11px;margin-top:3px}
.act.sys .bubble{background:none;border:0;padding:2px 0;color:var(--text-dim);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);background:#172b4d;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}
.hint{position:fixed;right:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:11.5px;color:var(--text-dim);box-shadow:var(--shadow);max-width:250px}
kbd{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">F</div>
      <div><b>FlowBoard</b><small>Acme Workspace</small></div>
    </div>
    <div class="side-sec">Boards</div>
    <div class="side-list" id="boardList"></div>
    <div class="side-foot">
      <div class="avatar" style="background:#3d6df0">AM</div>
      <div class="who"><div>Anas Matar</div><small>Workspace admin</small></div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <button class="icon-btn" id="toggleSide" title="Toggle sidebar">☰</button>
      <input class="board-title" id="boardTitle" />
      <button class="icon-btn" id="starBtn" title="Star board">☆</button>
      <div class="spacer"></div>
      <div class="search">
        <span>🔍</span><input id="searchInput" placeholder="Search cards…" />
      </div>
      <button class="btn" id="filterBtn">⚙ Filter</button>
      <div class="avatars" id="boardMembers"></div>
      <button class="btn sm" id="inviteBtn">＋ Invite</button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
    </div>

    <div class="chip-bar hidden" id="chipBar"></div>
    <div class="board" id="board"></div>
  </div>
</div>

<!-- Card modal -->
<div class="scrim" id="scrim">
  <div class="modal" id="modal">
    <div class="modal-head">
      <span style="font-size:19px">🗂</span>
      <textarea id="mTitle" rows="1"></textarea>
      <button class="icon-btn" id="mClose">✕</button>
    </div>
    <div class="modal-sub" id="mSub"></div>
    <div class="modal-body">
      <div>
        <div class="sect" id="mLabelsSect">
          <h4>Labels</h4><div class="card-labels" id="mLabels"></div>
        </div>
        <div class="sect" id="mMembersSect">
          <h4>Members</h4><div class="avatars" id="mMembers"></div>
        </div>
        <div class="sect">
          <h4>Description</h4>
          <textarea class="desc" id="mDesc" placeholder="Add a more detailed description…"></textarea>
          <div style="margin-top:7px"><button class="btn primary sm" id="mSaveDesc">Save</button></div>
        </div>
        <div class="sect">
          <h4>Checklist <span id="mCheckPct" style="color:var(--text-dim);font-weight:400"></span></h4>
          <div class="checkbar"><i id="mCheckBar" style="width:0%"></i></div>
          <div id="mCheckItems"></div>
          <div style="display:flex;gap:6px;margin-top:7px">
            <input id="mCheckNew" placeholder="Add an item…" style="flex:1;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);outline:none">
            <button class="btn sm" id="mCheckAdd">Add</button>
          </div>
        </div>
        <div class="sect">
          <h4>Activity</h4>
          <div class="comment-box">
            <div class="avatar" style="background:#3d6df0">AM</div>
            <textarea id="mComment" placeholder="Write a comment…"></textarea>
          </div>
          <div style="margin:-6px 0 12px 39px"><button class="btn primary sm" id="mCommentSave">Comment</button></div>
          <div id="mActivity"></div>
        </div>
      </div>
      <div class="side-actions">
        <h4 style="margin:0 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim)">Add to card</h4>
        <button class="btn" id="aMembers">👤 Members</button>
        <button class="btn" id="aLabels">🏷 Labels</button>
        <button class="btn" id="aDue">📅 Due date</button>
        <button class="btn" id="aMove">➡ Move</button>
        <button class="btn" id="aCopy">⧉ Copy</button>
        <button class="btn danger" id="aDelete">🗑 Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="pop" id="pop"></div>
<div class="toast" id="toast"></div>
<div class="hint">Prototype · drag cards & lists · click a card to open it · state is in-memory only</div>

<script>
/* =====================================================================
   FlowBoard — clickable prototype
   In-memory state only (no persistence) — see FUNCTIONAL_SPEC.md
   ===================================================================== */

const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 9);
const MEMBERS = [
  {id:'u1', name:'Anas Matar',   initials:'AM', color:'#3d6df0'},
  {id:'u2', name:'Lena Fischer', initials:'LF', color:'#8f5bff'},
  {id:'u3', name:'Omar Haddad',  initials:'OH', color:'#22a06b'},
  {id:'u4', name:'Priya Nair',   initials:'PN', color:'#e2703a'},
  {id:'u5', name:'Tom Becker',   initials:'TB', color:'#c9372c'}
];
const LABELS = [
  {id:'l1', name:'Bug',      color:'#c9372c'},
  {id:'l2', name:'Feature',  color:'#22a06b'},
  {id:'l3', name:'Design',   color:'#8f5bff'},
  {id:'l4', name:'Urgent',   color:'#e2703a'},
  {id:'l5', name:'Research', color:'#3d6df0'},
  {id:'l6', name:'Blocked',  color:'#6b778c'}
];
const ME = MEMBERS[0];
const day = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };

function card(title, o={}) {
  return Object.assign({
    id: uid('c'), title, desc:'', labelIds:[], memberIds:[], due:null, doneFlag:false,
    checklist:[], activity:[{id:uid('a'), type:'sys', text:'created this card', who:ME.id, at:'2 days ago'}]
  }, o);
}

const state = {
  activeBoardId: 'b1',
  filter: { text:'', labelIds:[], memberIds:[], due:'' },
  boards: [
    {
      id:'b1', name:'Product Roadmap Q3', color:'#3d6df0', starred:true,
      memberIds:['u1','u2','u3','u4'],
      lists:[
        {id:'s1', name:'Backlog', wip:0, cards:[
          card('Research competitor onboarding flows', {labelIds:['l5'], memberIds:['u2'], desc:'Compare Trello, Asana and Monday first-run experience. Capture screenshots.'}),
          card('Define SSO requirements for Enterprise', {labelIds:['l2'], due:day(12)}),
          card('Accessibility audit (WCAG 2.2 AA)', {labelIds:['l3','l5'], memberIds:['u4']})
        ]},
        {id:'s2', name:'Design', wip:3, cards:[
          card('Card detail redesign', {labelIds:['l3'], memberIds:['u4'], due:day(3),
            desc:'Simplify the right rail; move destructive actions behind a menu.',
            checklist:[{id:uid('k'),text:'Wireframes',done:true},{id:uid('k'),text:'Hi-fi mockups',done:true},{id:uid('k'),text:'Dev handoff',done:false}]}),
          card('Empty-state illustrations', {labelIds:['l3'], memberIds:['u2']})
        ]},
        {id:'s3', name:'In Progress', wip:3, cards:[
          card('Drag & drop performance on large boards', {labelIds:['l1','l4'], memberIds:['u3'], due:day(1),
            desc:'Boards with 500+ cards drop frames while dragging. Virtualise the list body.',
            checklist:[{id:uid('k'),text:'Profile with 1k cards',done:true},{id:uid('k'),text:'Virtualise list',done:false}],
            activity:[{id:uid('a'),type:'c',who:'u3',text:'Repro confirmed at ~600 cards on Chrome.',at:'yesterday'}]}),
          card('Board member invitations', {labelIds:['l2'], memberIds:['u1','u2'], due:day(5)}),
          card('Label filter in the top bar', {labelIds:['l2'], memberIds:['u4']})
        ]},
        {id:'s4', name:'Review', wip:2, cards:[
          card('Keyboard shortcuts pass', {labelIds:['l2'], memberIds:['u5'], due:day(-1)}),
          card('Activity feed pagination', {labelIds:['l1'], memberIds:['u3']})
        ]},
        {id:'s5', name:'Done', wip:0, cards:[
          card('Workspace switcher', {labelIds:['l2'], memberIds:['u1'], due:day(-6), doneFlag:true}),
          card('List reordering', {labelIds:['l2'], memberIds:['u3'], due:day(-9), doneFlag:true})
        ]}
      ]
    },
    {
      id:'b2', name:'Marketing Launch', color:'#8f5bff', starred:false, memberIds:['u1','u4','u5'],
      lists:[
        {id:'m1', name:'Ideas', wip:0, cards:[card('Launch webinar'), card('Customer story: Northwind')]},
        {id:'m2', name:'In Progress', wip:2, cards:[card('Pricing page copy', {labelIds:['l4'], memberIds:['u5'], due:day(2)})]},
        {id:'m3', name:'Published', wip:0, cards:[card('Blog: why WIP limits work', {doneFlag:true, due:day(-3)})]}
      ]
    },
    {
      id:'b3', name:'Customer Support', color:'#22a06b', starred:false, memberIds:['u1','u3'],
      lists:[
        {id:'t1', name:'New', wip:0, cards:[card('Ticket #4821 — export fails', {labelIds:['l1','l4'], due:day(0)})]},
        {id:'t2', name:'Investigating', wip:3, cards:[card('Ticket #4790 — slow board load', {labelIds:['l1'], memberIds:['u3']})]},
        {id:'t3', name:'Resolved', wip:0, cards:[]}
      ]
    }
  ]
};

/* ---------- helpers ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const board    = () => state.boards.find(b => b.id === state.activeBoardId);
const member   = id => MEMBERS.find(m => m.id === id);
const labelOf  = id => LABELS.find(l => l.id === id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function findCard(id){
  for (const b of state.boards) for (const l of b.lists){
    const i = l.cards.findIndex(c => c.id === id);
    if (i > -1) return {board:b, list:l, card:l.cards[i], index:i};
  }
  return null;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); }
function dueClass(c){
  if (!c.due) return '';
  if (c.doneFlag) return 'done';
  const diff = (new Date(c.due) - new Date(new Date().toISOString().slice(0,10))) / 86400000;
  if (diff < 0) return 'over';
  if (diff <= 2) return 'soon';
  return '';
}
function dueLabel(d){
  const dt = new Date(d), now = new Date(new Date().toISOString().slice(0,10));
  const diff = Math.round((dt - now) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function passesFilter(c){
  const f = state.filter;
  if (f.text){
    const hay = (c.title + ' ' + c.desc).toLowerCase();
    if (!hay.includes(f.text.toLowerCase())) return false;
  }
  if (f.labelIds.length  && !f.labelIds.some(id => c.labelIds.includes(id)))   return false;
  if (f.memberIds.length && !f.memberIds.some(id => c.memberIds.includes(id))) return false;
  if (f.due === 'overdue' && dueClass(c) !== 'over') return false;
  if (f.due === 'week'){
    if (!c.due) return false;
    const diff = (new Date(c.due) - new Date()) / 86400000;
    if (diff < -1 || diff > 7) return false;
  }
  if (f.due === 'none' && c.due) return false;
  return true;
}
const filterActive = () => !!(state.filter.text || state.filter.labelIds.length || state.filter.memberIds.length || state.filter.due);

               memberIds:['u1'], lists:[{id:uid('s'),name:'To Do',wip:0,cards:[]},{id:uid('s'),name:'Doing',wip:3,cards:[]},{id:uid('s'),name:'Done',wip:0,cards:[]}]};

/* ---------- render: top bar ---------- */
function renderTop(){
  const b = board();
  $('#boardTitle').value = b.name;
  $('#starBtn').textContent = b.starred ? '★' : '☆';
  $('#boardMembers').innerHTML = b.memberIds.map(id => {
    const m = member(id);
    return `<div class="avatar" style="background:${m.color}" title="${esc(m.name)}">${m.initials}</div>`;
  }).join('');

  const chips = [];
  if (state.filter.text)  chips.push(['text', `Text: “${esc(state.filter.text)}”`]);
  state.filter.labelIds.forEach(id => chips.push(['label:'+id, 'Label: ' + esc(labelOf(id).name)]));
  state.filter.memberIds.forEach(id => chips.push(['member:'+id, 'Member: ' + esc(member(id).name)]));
  if (state.filter.due) chips.push(['due', 'Due: ' + ({overdue:'Overdue', week:'Next 7 days', none:'No date'}[state.filter.due])]);

  const bar = $('#chipBar');
  bar.classList.toggle('hidden', chips.length === 0);
  if (chips.length){
    bar.innerHTML = `<span style="font-size:12px;color:var(--text-dim)">Filters</span>` +
      chips.map(([k,t]) => `<span class="chip">${t}<button class="x" data-clear="${k}">✕</button></span>`).join('') +
      `<button class="btn sm" id="clearAll">Clear all</button>`;
    $$('[data-clear]', bar).forEach(el => el.onclick = () => {
      const k = el.dataset.clear;
      if (k === 'text'){ state.filter.text=''; $('#searchInput').value=''; }
      else if (k === 'due') state.filter.due = '';
      else if (k.startsWith('label:'))  state.filter.labelIds  = state.filter.labelIds.filter(x => x !== k.slice(6));
      else if (k.startsWith('member:')) state.filter.memberIds = state.filter.memberIds.filter(x => x !== k.slice(7));
      renderAll();
    });
    $('#clearAll').onclick = () => { state.filter={text:'',labelIds:[],memberIds:[],due:''}; $('#searchInput').value=''; renderAll(); };
  }
}

/* ---------- render: board ---------- */
function renderBoard(){
  const b = board();
  const host = $('#board');
  host.innerHTML = b.lists.map(list => {
    const visible = list.cards.filter(passesFilter);
    const over = list.wip > 0 && list.cards.length > list.wip;
    return `
    <section class="list" data-list="${list.id}" draggable="true">
      <div class="list-head">
        <input value="${esc(list.name)}" data-rename="${list.id}">
        <span class="pill ${over?'wip-over':''}" title="${list.wip?('WIP limit '+list.wip):'No WIP limit'}">${list.cards.length}${list.wip?('/'+list.wip):''}</span>
        <button class="icon-btn" data-listmenu="${list.id}" style="width:26px;height:26px">⋯</button>
      </div>
      <div class="cards" data-drop="${list.id}">
        ${visible.map(c => cardHTML(c)).join('') ||
          `<div class="empty">${filterActive() ? 'No cards match the filter' : 'Drop cards here'}</div>`}
      </div>
      <div class="list-foot">
        <button class="add-card" data-add="${list.id}">＋ Add a card</button>
      </div>
    </section>`;
  }).join('') + `<button class="add-list" id="addList">＋ Add another list</button>`;

  wireBoard();
}

function cardHTML(c){
  const labs = c.labelIds.map(id => { const l = labelOf(id);
    return `<span class="lab text" style="background:${l.color}">${esc(l.name)}</span>`; }).join('');
  const avs = c.memberIds.map(id => { const m = member(id);
    return `<span class="avatar" style="background:${m.color}" title="${esc(m.name)}">${m.initials}</span>`; }).join('');
  const done = c.checklist.filter(k => k.done).length;
  const meta = [];
  if (c.due) meta.push(`<span class="m due ${dueClass(c)}">📅 ${dueLabel(c.due)}</span>`);
  if (c.desc) meta.push(`<span class="m" title="This card has a description">≡</span>`);
  if (c.checklist.length) meta.push(`<span class="m">☑ ${done}/${c.checklist.length}</span>`);
  const comments = c.activity.filter(a => a.type === 'c').length;
  if (comments) meta.push(`<span class="m">💬 ${comments}</span>`);
  return `<article class="card" draggable="true" data-card="${c.id}">
    ${labs ? `<div class="card-labels">${labs}</div>` : ''}
    <div class="card-title">${esc(c.title)}</div>
    <div class="card-meta">${meta.join('')}<span style="flex:1"></span><span class="avatars">${avs}</span></div>
  </article>`;
}

/* ---------- board interactions ---------- */
let dragCardId = null, dragListId = null;

function wireBoard(){
  // open card
  $$('[data-card]').forEach(el => el.onclick = e => { if (!el.classList.contains('dragging')) openCard(el.dataset.card); });

  // rename list
  $$('[data-rename]').forEach(el => {
    el.onclick = e => e.stopPropagation();
    el.onchange = () => {
      const l = board().lists.find(x => x.id === el.dataset.rename);
      l.name = el.value.trim() || l.name; renderBoard(); toast('List renamed');
    };
  });

  // list menu
  $$('[data-listmenu]').forEach(el => el.onclick = e => { e.stopPropagation(); listMenu(el, el.dataset.listmenu); });

  // add card composer
  $$('[data-add]').forEach(el => el.onclick = () => openComposer(el.dataset.add));

  // add list
  $('#addList').onclick = () => {
    const name = prompt('List name', 'New list');
    if (!name) return;
    board().lists.push({id:uid('s'), name, wip:0, cards:[]});
    renderAll(); toast('List added');
  };

  // ----- drag & drop: cards -----
  $$('[data-card]').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragCardId = el.dataset.card; dragListId = null;
      el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragCardId); e.stopPropagation();
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); dragCardId = null; renderBoard(); });
  });

  $$('[data-drop]').forEach(zone => {
    zone.addEventListener('dragover', e => {
      if (!dragCardId) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      zone.closest('.list').classList.add('drag-over');
    });
    zone.addEventListener('dragleave', () => zone.closest('.list').classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      if (!dragCardId) return;
      e.preventDefault(); e.stopPropagation();
      zone.closest('.list').classList.remove('drag-over');
      const found = findCard(dragCardId); if (!found) return;
      const target = board().lists.find(l => l.id === zone.dataset.drop);

      // Which visible sibling should the card land before?
      const siblings = [...zone.querySelectorAll('.card')].filter(el => el.dataset.card !== dragCardId);
      let beforeId = null;
      for (const el of siblings){
        const r = el.getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2){ beforeId = el.dataset.card; break; }
      }
      // Remove from source, then insert at the resolved position in the target list
      found.list.cards.splice(found.index, 1);
      const at = beforeId ? target.cards.findIndex(c => c.id === beforeId) : -1;
      target.cards.splice(at > -1 ? at : target.cards.length, 0, found.card);
      if (found.list.id !== target.id){
        found.card.doneFlag = /done|resolved|published|complete/i.test(target.name);
        found.card.activity.unshift({id:uid('a'), type:'sys', who:ME.id,
          text:`moved this card from ${found.list.name} to ${target.name}`, at:'just now'});
        toast(`Moved to “${target.name}”`);
      }
      dragCardId = null; renderAll();
    });
  });

  // ----- drag & drop: lists -----
  $$('[data-list]').forEach(el => {
    el.addEventListener('dragstart', e => {
      if (dragCardId) return;
      dragListId = el.dataset.list; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); dragListId = null; });
    el.addEventListener('dragover', e => {
      if (!dragListId || dragListId === el.dataset.list) return;
      e.preventDefault(); el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', () => { if (dragListId) el.classList.remove('drag-over'); });
    el.addEventListener('drop', e => {
      if (!dragListId || dragListId === el.dataset.list) return;
      e.preventDefault(); el.classList.remove('drag-over');
      const ls = board().lists;
      const from = ls.findIndex(l => l.id === dragListId);
      const to   = ls.findIndex(l => l.id === el.dataset.list);
      ls.splice(to, 0, ls.splice(from, 1)[0]);
      dragListId = null; renderBoard(); toast('List reordered');
    });
  });
}

function openComposer(listId){
  const foot = $(`[data-add="${listId}"]`).parentElement;
  foot.innerHTML = `<div class="composer">
      <textarea placeholder="Enter a title for this card…"></textarea>
      <div class="row"><button class="btn primary sm" data-save>Add card</button>
      <button class="btn sm" data-cancel>Cancel</button>
      <span style="font-size:11.5px;color:var(--text-dim)">Enter to add</span></div>
    </div>`;
  const ta = $('textarea', foot); ta.focus();
  const save = () => {
    const t = ta.value.trim(); if (!t){ renderBoard(); return; }
    board().lists.find(l => l.id === listId).cards.push(card(t));
    renderAll(); openComposer(listId);
  };
  $('[data-save]', foot).onclick = save;
  $('[data-cancel]', foot).onclick = () => renderBoard();
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); save(); } if (e.key === 'Escape') renderBoard(); };
}

function listMenu(anchor, listId){
  const list = board().lists.find(l => l.id === listId);
  popup(anchor, 'List actions', `
    <button class="pop-row" data-a="wip">🎯 Set WIP limit ${list.wip ? '(now '+list.wip+')' : ''}</button>
    <button class="pop-row" data-a="sort">⇅ Sort by due date</button>
    <button class="pop-row" data-a="clear">🧹 Archive all cards</button>
    <button class="pop-row" data-a="del" style="color:#c9372c">🗑 Delete list</button>`,
  host => {
    $('[data-a="wip"]', host).onclick = () => {
      const v = prompt('WIP limit (0 = none)', list.wip); if (v === null) return;
      list.wip = Math.max(0, parseInt(v) || 0); closePop(); renderBoard(); toast('WIP limit updated');
    };
    $('[data-a="sort"]', host).onclick = () => {
      list.cards.sort((a,b) => (a.due||'9999').localeCompare(b.due||'9999'));
      closePop(); renderBoard(); toast('Sorted by due date');
    };
    $('[data-a="clear"]', host).onclick = () => { list.cards = []; closePop(); renderAll(); toast('Cards archived'); };
    $('[data-a="del"]',   host).onclick = () => {
      board().lists = board().lists.filter(l => l.id !== listId); closePop(); renderAll(); toast('List deleted');
    };
  });
}

/* ---------- popups ---------- */
function popup(anchor, title, html, wire){
  const p = $('#pop');
  p.innerHTML = `<h5>${title}</h5>${html}`;
  p._anchor = anchor;
  p.classList.add('open');
  const r = anchor.getBoundingClientRect();
  p.style.top  = Math.min(r.bottom + 6, innerHeight - p.offsetHeight - 10) + 'px';
  p.style.left = Math.min(r.left, innerWidth - p.offsetWidth - 10) + 'px';
  wire && wire(p);
}
const closePop = () => { const p = $('#pop'); p.classList.remove('open'); p._anchor = null; };
document.addEventListener('click', e => {
  const p = $('#pop');
  if (e.target.closest('#pop')) return;                       // clicks inside the popup
  if (p._anchor && p._anchor.contains(e.target)) return;      // the button that opened it
  closePop();
});

}

function renderModal(){
  const f = findCard(openCardId); if (!f) return closeCard();
  const c = f.card;
  $('#mTitle').value = c.title;
  $('#mSub').innerHTML = `in list <b>${esc(f.list.name)}</b> · board <b>${esc(f.board.name)}</b>${c.due ? ` · due <span class="due ${dueClass(c)}">${dueLabel(c.due)}</span>` : ''}`;

  $('#mLabelsSect').style.display  = c.labelIds.length  ? '' : 'none';
  $('#mMembersSect').style.display = c.memberIds.length ? '' : 'none';
  $('#mLabels').innerHTML  = c.labelIds.map(id => { const l = labelOf(id);
    return `<span class="lab text" style="background:${l.color};height:auto;padding:3px 9px">${esc(l.name)}</span>`; }).join('');
  $('#mMembers').innerHTML = c.memberIds.map(id => { const m = member(id);
    return `<span class="avatar" style="background:${m.color}" title="${esc(m.name)}">${m.initials}</span>`; }).join('');
  $('#mDesc').value = c.desc;

  const done = c.checklist.filter(k => k.done).length, tot = c.checklist.length;
  $('#mCheckPct').textContent = tot ? `${Math.round(done/tot*100)}%` : '';
  $('#mCheckBar').style.width = tot ? (done/tot*100)+'%' : '0%';
  $('#mCheckItems').innerHTML = c.checklist.map(k =>
    `<label class="check-item ${k.done?'done':''}"><input type="checkbox" data-k="${k.id}" ${k.done?'checked':''}><span>${esc(k.text)}</span>
     <button class="icon-btn" data-kdel="${k.id}" style="width:24px;height:24px">✕</button></label>`).join('')
    || `<div style="color:var(--text-dim);font-size:12.5px">No checklist items yet.</div>`;
  $$('[data-k]').forEach(el => el.onchange = () => {
    c.checklist.find(k => k.id === el.dataset.k).done = el.checked; renderModal();
  });
  $$('[data-kdel]').forEach(el => el.onclick = e => {
    e.preventDefault(); c.checklist = c.checklist.filter(k => k.id !== el.dataset.kdel); renderModal();
  });

  $('#mActivity').innerHTML = c.activity.map(a => {
    const m = member(a.who) || ME;
    return a.type === 'c'
      ? `<div class="act"><span class="avatar" style="background:${m.color}">${m.initials}</span>
           <div><div class="bubble">${esc(a.text)}</div><div class="when">${esc(m.name)} · ${esc(a.at)}</div></div></div>`
      : `<div class="act sys"><span class="avatar" style="background:${m.color};width:22px;height:22px;font-size:9.5px">${m.initials}</span>
           <div class="bubble"><b>${esc(m.name)}</b> ${esc(a.text)} · <span class="when" style="display:inline">${esc(a.at)}</span></div></div>`;
  }).join('');
}

  }));
};
$('#filterBtn').onclick = e => {
  const f = state.filter;
  popup(e.currentTarget, 'Filter cards',
    `<div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin:2px 0 5px">Labels</div>` +
    LABELS.map(l => `<button class="pop-row" data-fl="${l.id}"><span class="lab" style="background:${l.color};width:26px"></span>${esc(l.name)}${f.labelIds.includes(l.id)?'<span class="tick">✓</span>':''}</button>`).join('') +
    `<div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin:9px 0 5px">Members</div>` +
    MEMBERS.map(m => `<button class="pop-row" data-fm="${m.id}"><span class="avatar" style="background:${m.color};width:22px;height:22px;font-size:9.5px">${m.initials}</span>${esc(m.name)}${f.memberIds.includes(m.id)?'<span class="tick">✓</span>':''}</button>`).join('') +
    `<div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin:9px 0 5px">Due date</div>` +
    [['overdue','Overdue'],['week','Due in the next 7 days'],['none','No due date']].map(([k,t]) =>
      `<button class="pop-row" data-fd="${k}">${t}${f.due===k?'<span class="tick">✓</span>':''}</button>`).join(''),
  host => {
    $$('[data-fl]', host).forEach(el => el.onclick = () => {
      const id = el.dataset.fl;
      f.labelIds = f.labelIds.includes(id) ? f.labelIds.filter(x => x !== id) : [...f.labelIds, id];
      renderAll(); $('#filterBtn').click();
    });
    $$('[data-fm]', host).forEach(el => el.onclick = () => {
      const id = el.dataset.fm;
      f.memberIds = f.memberIds.includes(id) ? f.memberIds.filter(x => x !== id) : [...f.memberIds, id];
      renderAll(); $('#filterBtn').click();
    });
    $$('[data-fd]', host).forEach(el => el.onclick = () => {
      f.due = f.due === el.dataset.fd ? '' : el.dataset.fd;
      renderAll(); $('#filterBtn').click();
    });
  });
};

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (openCardId) closeCard(); closePop(); }
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (!typing && (e.key === '/' || (e.key === 'f' && !e.metaKey && !e.ctrlKey))){ e.preventDefault(); $('#searchInput').focus(); }
});

/* ---------- boot ---------- */
function renderAll(){ renderSidebar(); renderTop(); renderBoard(); }
renderAll();
</script>
</body>
</html>
