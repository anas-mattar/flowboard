# Local development database (CL-D8: no cloud dependency, CL-E21: names, port, test database).
# The credentials below are a documented throwaway for local development only (STANDARDS §1.5).
services:
  postgres:
    image: postgres:16.10-alpine
    container_name: flowboard-postgres
    restart: unless-stopped
    # Throwaway database, so durability is traded for speed (TAS-154): every
    # integration test truncates all tables, and with fsync on one truncate costs
    # about 3.5 s on a Docker volume. If the host crashes, `docker compose down -v`
    # and `docker compose up -d` rebuild both databases. Never copy these flags
    # to a database that holds data anyone wants to keep.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_DB: flowboard
      POSTGRES_USER: flowboard
      POSTGRES_PASSWORD: flowboard
    ports:
      - '5432:5432'
    volumes:
      - flowboard-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowboard -d flowboard']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  flowboard-pgdata:
