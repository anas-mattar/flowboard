# Local development database (CL-D8: no cloud dependency, CL-E21: names, port, test database).
# The credentials below are a documented throwaway for local development only (STANDARDS §1.5).
services:
  postgres:
    image: postgres:16.10-alpine
    container_name: flowboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowboard
      POSTGRES_USER: flowboard
      POSTGRES_PASSWORD: flowboard
    ports:
      - '5432:5432'
    volumes:
      - flowboard-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowboard -d flowboard']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  flowboard-pgdata:
