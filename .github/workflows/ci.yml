name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  merge-guard:
    # STANDARDS §1.12 (TAS-60, raised from the TAS-49 incident where PR #26 on
    # scratch/TAS-49-red-proof, titled "SCRATCH DO NOT MERGE", was merged into
    # main). Fails closed on a scratch head branch or a flagged title so a
    # scratch pull request opened by mistake shows a red check.
    name: Merge guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check head branch and title
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: tools/ci/merge-guard.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Conventional Commits on the pull request range
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: flowboard
          POSTGRES_USER: flowboard
          # Throwaway credential for an ephemeral CI container (STANDARDS §1.5, CL-E21).
          POSTGRES_PASSWORD: flowboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowboard -d flowboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://flowboard:flowboard@localhost:5432/flowboard
      DATABASE_URL_TEST: postgres://flowboard:flowboard@localhost:5432/flowboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the test database (CL-E21)
        run: |
          PGPASSWORD=flowboard psql -h localhost -U flowboard -d flowboard \
            -c "CREATE DATABASE flowboard_test OWNER flowboard;"
      - run: pnpm test:integration

  compose-smoke:
    # Proves FB-00 acceptance criterion 5 (CL-E21): the committed docker-compose.yml
    # really does bring up PostgreSQL 16 with both `flowboard` and `flowboard_test`.
    # The `integration` job above uses a GitHub service container and therefore never
    # exercises docker/postgres/init; this job does, end to end.
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Record the Docker and Compose versions
        run: |
          docker --version
          docker compose version

      - name: Use the documented .env.example values
        # Same step the README quickstart tells a developer to run. The values are the
        # documented local throwaway credentials, not secrets (STANDARDS §1.5, CL-E21).
        run: cp .env.example .env

      - name: docker compose up -d --wait
        run: docker compose up -d --wait

      - name: Assert both databases exist (FB-00 §4 item 5, CL-E21)
        run: |
          set -euo pipefail
          names=$(docker compose exec -T postgres \
            psql -U flowboard -d flowboard -tAc \
            "SELECT datname FROM pg_database WHERE datname IN ('flowboard','flowboard_test') ORDER BY datname")
          echo "pg_database returned:"
          echo "$names"
          expected=$(printf 'flowboard\nflowboard_test')
          if [ "$names" != "$expected" ]; then
            echo "::error::expected both 'flowboard' and 'flowboard_test'; got: $(echo "$names" | tr '\n' ' ')"
            exit 1
          fi
          echo "Both databases are present."

      - name: Integration tests against the compose database
        # DATABASE_URL / DATABASE_URL_TEST come from the .env copied above, so the
        # init-script path is what the suite actually connects to.
        run: pnpm test:integration

      - name: docker compose down -v
        if: always()
        run: docker compose down -v

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  playwright:
    # FB-00 §4 acceptance criteria 6 (Playwright smoke part) and 7 (axe-core on `/`),
    # run against the built API and a migrated + seeded database as the FB-00 spec
    # §3 requires now that FB-01 exists (TAS-49). STANDARDS §4: end-to-end tests
    # run against the real API and database, never mocks.
    name: Playwright smoke
    runs-on: ubuntu-latest
    services:
      # Deliberate copy of the `integration` job's service block. GitHub Actions
      # supports neither YAML anchors nor `extends` for services, and a composite
      # action cannot declare them either, so the two blocks must be changed
      # together whenever the Postgres image or credentials move.
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: flowboard
          POSTGRES_USER: flowboard
          # Throwaway credential for an ephemeral CI container (STANDARDS §1.5, CL-E21).
          POSTGRES_PASSWORD: flowboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowboard -d flowboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Every variable this job sets, all throwaway CI values and no secrets
      # (STANDARDS §1.5). The names and defaults come from
      # `flowboard-api/src/config/env.ts`.
      #
      #   DATABASE_URL          the CI Postgres service above; migrated and seeded below.
      #   HOST                  `::` binds dual-stack so the Vite proxy's
      #                         `http://localhost:3000` target resolves whether
      #                         `localhost` comes back as 127.0.0.1 or ::1.
      #   PORT                  the port `flowboard-web/vite.config.ts` proxies `/v1` to.
      #   WEB_ORIGIN            the single browser origin allowed to send a
      #                         cookie-authenticated mutation (FB-02 §9, CL-E9).
      #   CORS_ORIGIN           same origin, for the CORS pre-flight.
      #   SESSION_COOKIE_SECURE `false`: Playwright drives the app over plain
      #                         http, so a `Secure` cookie would never be sent back.
      #   LOG_LEVEL             `info`; the API log is uploaded as an artifact on failure.
      #   RATE_LIMIT_DISABLED   `true`: FB-02/FB-03 (TAS-21) sign up and log in
      #                         many times per run across three browser
      #                         projects; FB-02's own rate-limit behaviour is
      #                         covered by `flowboard-api/test/auth.ratelimit.test.ts`,
      #                         not this job (FB-02 spec §9).
      DATABASE_URL: postgres://flowboard:flowboard@localhost:5432/flowboard
      HOST: '::'
      PORT: '3000'
      WEB_ORIGIN: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      SESSION_COOKIE_SECURE: 'false'
      LOG_LEVEL: info
      RATE_LIMIT_DISABLED: 'true'
      API_LOG: ${{ github.workspace }}/flowboard-api-ci.log
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build every package
        # Builds @flowboard/shared (flowboard-web resolves it through package
        # `exports` to dist/, TAS-51) and compiles flowboard-api to
        # dist/src/server.js, which `pnpm --filter ./flowboard-api start` runs.
        run: pnpm build

      - name: Migrate the CI database
        run: pnpm db:migrate

      - name: Seed the prototype dataset
        run: pnpm db:seed

      - name: Install Playwright browsers
        # FB-02/FB-03 (TAS-21) suites run on all three projects (FB-03 spec
        # acceptance criterion 11); FB-00's own smoke spec only ran Chromium.
        run: pnpm --filter ./flowboard-web exec playwright install --with-deps chromium firefox webkit

      - name: Start the built API
        run: |
          set -euo pipefail
          pnpm --filter ./flowboard-api run start >"$API_LOG" 2>&1 &
          echo "$!" > api.pid
          echo "started flowboard-api as pid $(cat api.pid), logging to $API_LOG"

      - name: Wait for GET /v1/health to return ok
        # The gate that makes this job a real end-to-end run: if the API failed
        # to boot (bad env, unreachable database, migration drift) the job stops
        # here with the API's own log instead of silently testing a dead proxy.
        run: |
          set -uo pipefail
          for attempt in $(seq 1 60); do
            body="$(curl -fsS http://localhost:3000/v1/health || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "GET /v1/health ok after ${attempt}s: $body"
              exit 0
            fi
            sleep 1
          done
          echo "::error::GET http://localhost:3000/v1/health did not return status \"ok\" within 60s"
          echo "----- flowboard-api log -----"
          cat "$API_LOG" || true
          exit 1

      - name: End-to-end tests against the running API
        run: pnpm test:e2e

      - name: Stop the API
        if: always()
        run: |
          if [ -f api.pid ]; then kill "$(cat api.pid)" 2>/dev/null || true; fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: flowboard-web/playwright-report/
          retention-days: 7

      - name: Upload the API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flowboard-api-log
          path: flowboard-api-ci.log
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
